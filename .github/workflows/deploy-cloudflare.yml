name: Build and deploy portfolio to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7e1714b3d1b32fcaad4a5029c638cde4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Vite site
        run: npm run build

      - name: Validate Worker and static asset configuration
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

      - name: Explain missing Cloudflare credential
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN repository secret to enable production deployment."

      - name: Deploy Worker and static assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
